name: scrapers tests

on:
  push:
    branches: [master, develop, main]
    paths:
      - 'scraper-ios/**'
      - 'scraper-android/**'
      - '.github/workflows/scrapers-tests.yml'
  pull_request:
    branches: [master, develop, main]
    paths:
      - 'scraper-ios/**'
      - 'scraper-android/**'
      - '.github/workflows/scrapers-tests.yml'
  workflow_dispatch:

jobs:
  scraper-ios:
    name: scraper-ios (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-ios
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scraper-ios/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

  scraper-android:
    name: scraper-android (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-android
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper-android/requirements.txt

      - run: pip install -r requirements.txt

      - name: Pytest
        run: pytest -ra
